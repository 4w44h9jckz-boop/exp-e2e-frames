# C3's runner over kohaku-rs's kohaku-frame-ticket. The paths are the checkout run.ts makes from
# pins.json: work/<name>-<first 12 characters of the commit>. Commonware is upstream v2026.9.0
# with dkg::feldman_desmedt::run, from the owner's fork at the commit pins.json names, patched in
# for kohaku-rs's crates too.
[package]
name = "c3-reshare-runner"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
kohaku-frame-ticket = { path = "../../../work/kohaku-rs-ab056aba3348/crates/frame-ticket" }
kohaku-frame-kit = { path = "../../../work/kohaku-rs-ab056aba3348/crates/frame-kit" }
kohaku-frame-accounts = { path = "../../../work/kohaku-rs-ab056aba3348/crates/frame-accounts" }
alloy = "2.4.1"
anyhow = "1.0.104"
commonware-codec = "2026.9.0"
commonware-cryptography = "2026.9.0"
commonware-math = "2026.9.0"
commonware-parallel = "2026.9.0"
commonware-utils = "2026.9.0"
hex = "0.4.3"
rand = "0.10.2"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }

[patch.crates-io]
commonware-cryptography = { git = "https://github.com/4w44h9jckz-boop/cmw-monorepo", rev = "489e313e86d5808f3d874b67c5a48a75f85b64f7" }
commonware-codec = { git = "https://github.com/4w44h9jckz-boop/cmw-monorepo", rev = "489e313e86d5808f3d874b67c5a48a75f85b64f7" }
commonware-math = { git = "https://github.com/4w44h9jckz-boop/cmw-monorepo", rev = "489e313e86d5808f3d874b67c5a48a75f85b64f7" }
commonware-parallel = { git = "https://github.com/4w44h9jckz-boop/cmw-monorepo", rev = "489e313e86d5808f3d874b67c5a48a75f85b64f7" }
commonware-utils = { git = "https://github.com/4w44h9jckz-boop/cmw-monorepo", rev = "489e313e86d5808f3d874b67c5a48a75f85b64f7" }
