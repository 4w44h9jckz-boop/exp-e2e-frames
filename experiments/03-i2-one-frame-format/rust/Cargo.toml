# Runs kohaku-rs's kohaku-frame-kit against the vector set. The path is the checkout
# run.ts makes from pins.json: work/<name>-<first 12 characters of the commit>.
[package]
name = "i2-kohaku-runner"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
kohaku-frame-kit = { path = "../../../work/kohaku-rs-058d89dfdf59/crates/frame-kit", default-features = false }
alloy = { version = "2.4.1", default-features = false, features = [] }
serde_json = "1"
