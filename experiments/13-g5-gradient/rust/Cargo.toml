# G5's share check: whether two members' input shares rebuild an owner's bid. It reads the share
# files co-circom's split-input writes, with co-snarks at the commit the committee's workspace pins.
# Cargo.lock starts from committee/Cargo.lock.
[package]
name = "g5-shares"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
co-circom-types = { git = "https://github.com/TaceoLabs/co-snarks", rev = "436f63fa17f2f10ece38c6650df68da99fbc0307" }
mpc-core = { git = "https://github.com/TaceoLabs/co-snarks", rev = "436f63fa17f2f10ece38c6650df68da99fbc0307" }
ark-bn254 = "0.6"
ark-ff = "0.6"
serde_json = "1"
anyhow = "1.0.104"
