# C5's tracer: Shamir shares with a one-way key per holder, the tracing of a reconstruction box,
# and the evidence the staking contract checks. Written from ePrint 2024/405; no tracing library.
[package]
name = "c5-tracer"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
ark-bn254 = "0.6.0"
ark-ff = "0.6.0"
ark-std = "0.6.0"
hex = "0.4.3"
serde_json = "1.0.151"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
